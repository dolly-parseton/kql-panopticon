[workspace]
members = [
    "crates/kql-panopticon-core",
    "crates/panopticon-tui",
    "crates/kql-panopticon-pack-runner",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["dolly-parseton"]
license = "MIT"
repository = "https://github.com/dolly-parseton/kql-panopticon"
homepage = "https://github.com/dolly-parseton/kql-panopticon"

[workspace.dependencies]
# Azure SDK
azure_identity = "0.20"
azure_core = "0.20"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# HTTP
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
chrono = "0.4"
csv = "1.3"
regex = "1"
walkdir = "2"
dirs = "5.0"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Templating & extraction
tera = "1.19"
jsonpath_lib = "0.3"

# Data processing
polars = { version = "0.46", default-features = false, features = [
    "lazy",
    "json",
    "dtype-full",
    "strings",
] }

# TUI
ratatui = "0.28"
crossterm = "0.27"
tui-textarea = { version = "0.6", default-features = false, features = [
    "ratatui",
    "crossterm",
] }

# CLI/REPL
clap = { version = "4", features = ["derive"] }
clap-repl = "0.3"
env_logger = "0.11"

# FFI utilities
libloading = "0.8"
once_cell = "1.19"

# Internal crates
kql-panopticon-core = { path = "crates/kql-panopticon-core" }
kql-panopticon-tui = { path = "crates/panopticon-tui" }
kql-panopticon-pack-runner = { path = "crates/kql-panopticon-pack-runner" }
kql-language-tools = "0.1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
