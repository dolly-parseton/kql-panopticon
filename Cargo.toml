[package]
name = "kql-panopticon"
version = "0.4.0"
edition = "2021"
authors = ["dolly-parseton"]
license = "MIT"
repository = "https://github.com/dolly-parseton/kql-panopticon"
description = ""
keywords = [""]
categories = [""]

[lib]
path = "lib/src/lib.rs"

[[bin]]
name = "panopticon-cli"
path = "bins/cli/src/main.rs"

[[bin]]
name = "panopticon-tui"
path = "bins/tui/src/main.rs"
required-features = ["tui"]

[features]
default = ["tui"]
tui = [
    "dep:ratatui",
    "dep:crossterm",
    "dep:tui-textarea",
    "dep:tui-tree-widget",
    "dep:walkdir",
    "dep:log",
]

[dependencies]
# === CORE (always included) ===
# Azure SDK
azure_identity = "0.20"
azure_core = "0.20"

# Async runtime
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "fs",
    "time",
] }
async-trait = "0.1"

# HTTP
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
chrono = "0.4"
csv = "1.3"
regex = "1"
dirs = "5.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Templating & extraction
tera = "1.19"
jsonpath_lib = "0.3"

# Data processing
polars = { version = "0.46", default-features = false, features = [
    "lazy",
    "json",
    "dtype-full",
    "strings",
] }

# CLI (both bins use this)
clap = { version = "4", features = ["derive"] }

# KQL validation
kql-language-tools = "0.1.0"

# === TUI (optional, feature-gated) ===
ratatui = { version = "0.28", optional = true }
crossterm = { version = "0.27", optional = true }
tui-textarea = { version = "0.6", optional = true, default-features = false, features = [
    "ratatui",
    "crossterm",
] }
tui-tree-widget = { version = "0.22", optional = true }
walkdir = { version = "2", optional = true }
log = { version = "0.4", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros"] }
tempfile = "3.19"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
