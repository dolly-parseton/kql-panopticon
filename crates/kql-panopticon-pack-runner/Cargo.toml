[package]
name = "kql-panopticon-pack-runner"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI tool for running KQL packs against Azure Log Analytics workspaces"
keywords = ["azure", "kql", "log-analytics", "sentinel", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "pack-runner"
path = "src/main.rs"

[dependencies]
# Core library
kql-panopticon-core.workspace = true

# Async runtime
tokio.workspace = true

# CLI
clap.workspace = true

# Serialization (for debug output)
serde_json.workspace = true

# Error handling
anyhow.workspace = true

# Logging/Tracing
tracing.workspace = true
tracing-subscriber.workspace = true
