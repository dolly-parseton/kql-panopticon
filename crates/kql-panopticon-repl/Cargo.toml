[package]
name = "kql-panopticon-repl"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Interactive REPL for KQL query execution and pack management"
keywords = ["azure", "kql", "log-analytics", "repl", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "kql-repl"
path = "src/main.rs"

[features]
default = []
tui = []  # Full TUI shell (in development)

[dependencies]
# Core library
kql-panopticon-core.workspace = true

# Async runtime
tokio.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Utilities
chrono.workspace = true
dirs.workspace = true
log.workspace = true
uuid.workspace = true
indexmap = { version = "2.7", features = ["serde"] }
regex.workspace = true

# CLI/REPL
clap.workspace = true
clap-repl.workspace = true
clap_complete = { version = "=4.5.16", features = ["unstable-dynamic", "unstable-command"] }
reedline = { version = "0.38.0", features = ["external_printer"] }
shlex = "1.3.0"
env_logger.workspace = true

# TUI (for popups, editor, monitor)
ratatui.workspace = true
crossterm.workspace = true
tui-textarea = "0.6"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
