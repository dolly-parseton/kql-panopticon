# Example Investigation Pack with HTTP Steps
# This demonstrates the HTTP step feature for enriching KQL query results
# with external API data (in this case, IP reputation/geolocation)
#
# NOTE: This is an example - replace the API endpoints and keys with real ones
# for your threat intelligence provider.

kind: investigation
name: IP Enrichment Investigation
description: |
  Investigates suspicious IP addresses found in Azure logs by:
  1. Querying Azure Sentinel for failed sign-ins
  2. Enriching each source IP with threat intelligence data
  3. Generating a report with risk scores

version: "1.0"

# Secrets are resolved from environment variables
secrets:
  threat_intel_api_key: "${THREAT_INTEL_API_KEY}"

# User inputs
inputs:
  - name: timespan
    description: Time range for the KQL query
    type: string
    required: false
    default: "P7D"
  - name: threshold
    description: Minimum failed sign-in count to investigate
    type: string
    required: false
    default: "10"

# Output folder template
output:
  folder: "./investigations/{{name}}/{{timestamp}}"

steps:
  # Step 1: KQL query to find suspicious IPs
  - name: suspicious_ips
    query: |
      SigninLogs
      | where TimeGenerated > ago({{inputs.timespan}})
      | where ResultType != "0"
      | summarize FailedAttempts = count() by IPAddress
      | where FailedAttempts >= {{inputs.threshold}}
      | project IPAddress, FailedAttempts
      | order by FailedAttempts desc
      | take 20

  # Step 2: HTTP enrichment for each IP (using foreach)
  # This calls an external threat intelligence API for each IP
  - name: ip_enrichment
    type: http
    depends_on:
      - suspicious_ips
    foreach: "suspicious_ips as ip"

    request:
      method: GET
      url: "https://api.threatintel.example.com/v1/ip/{{ip.IPAddress}}"
      headers:
        Authorization: "Bearer {{secrets.threat_intel_api_key}}"
        Accept: "application/json"

    response:
      fields:
        ip_address: "$.ip"
        country: "$.location.country"
        city: "$.location.city"
        is_malicious: "$.threat.is_malicious"
        threat_score: "$.threat.score"
        threat_categories: "$.threat.categories[*]"
        last_seen: "$.last_seen"

    # Rate limiting: max 10 requests per second
    rate_limit:
      requests: 10
      per: second

    # Continue even if some IP lookups fail
    on_error: continue

    # Default aggregation: append all results
    aggregate: append

  # Step 3: Alternative - batch lookup (if API supports it)
  # This demonstrates how to use array syntax for bulk API calls
  - name: bulk_ip_check
    type: http
    depends_on:
      - suspicious_ips
    when: "length(suspicious_ips) > 0"

    request:
      method: POST
      url: "https://api.threatintel.example.com/v1/ip/batch"
      headers:
        Authorization: "Bearer {{secrets.threat_intel_api_key}}"
        Content-Type: "application/json"
      body:
        ips: "{{suspicious_ips.*.IPAddress}}"

    response:
      fields:
        ip_address: "$.results[*].ip"
        risk_level: "$.results[*].risk_level"
        country: "$.results[*].country"

    on_error: fail

# Report configuration
report:
  format: markdown
  output: "report-{{timestamp}}.md"
  template: |
    # IP Enrichment Investigation Report

    **Generated:** {{ meta.timestamp }}
    **Time Range:** {{ inputs.timespan }}

    ## Verdict

    **Level:** {{ verdict.level }}
    **Summary:** {{ verdict.summary }}
    **Recommendation:** {{ verdict.recommendation }}

    ---

    ## Summary

    Found {{ suspicious_ips | length }} suspicious IP addresses with {{ inputs.threshold }}+ failed sign-in attempts.

    ## Enriched Results

    {% if ip_enrichment %}
    | IP Address | Country | Threat Score | Malicious |
    |------------|---------|--------------|-----------|
    {% for row in ip_enrichment %}
    | {{ row.ip_address }} | {{ row.country | default(value="Unknown") }} | {{ row.threat_score | default_nan(value="N/A") }} | {{ row.is_malicious | default(value="Unknown") }} |
    {% endfor %}
    {% else %}
    No enrichment data available.
    {% endif %}

    ---

    {% if scoring %}
    ## Risk Scoring

    **Total Score:** {{ scoring.total_score }}
    **Assessment:** {{ scoring.level }}

    ### Contributing Factors
    {% if scoring.matched_indicators %}
    | Indicator | Weight | Description |
    |-----------|--------|-------------|
    {% for ind in scoring.matched_indicators %}
    | {{ ind.name }} | {{ ind.weight }} | {{ ind.description | default(value="") }} |
    {% endfor %}
    {% else %}
    No risk indicators matched.
    {% endif %}
    {% endif %}

    ---

    *Report generated by kql-panopticon*

  verdict_rules:
    - name: malicious_ips_found
      condition: "ip_enrichment.any(is_malicious == true)"
      level: "CRITICAL"
      summary: "Known malicious IP addresses detected"
      recommendation: "Block these IPs immediately and investigate affected accounts."

    - name: high_threat_score
      condition: "ip_enrichment.any(threat_score > 80)"
      level: "HIGH"
      summary: "High threat score IPs detected (>80)"
      recommendation: "Review threat intelligence and consider blocking."

    - name: moderate_threat
      condition: "ip_enrichment.any(threat_score > 50)"
      level: "MEDIUM"
      summary: "Moderate threat score IPs detected (>50)"
      recommendation: "Monitor these IPs and review sign-in patterns."

    - name: low_threat
      condition: "true"
      level: "LOW"
      summary: "No high-risk indicators detected"
      recommendation: "Continue monitoring. Failed sign-ins may be benign."

# Scoring configuration for weighted risk assessment
scoring:
  indicators:
    # High-risk indicators (positive weights)
    - name: malicious_ips
      condition: "ip_enrichment.any(is_malicious == true)"
      weight: 50
      description: "Known malicious IP addresses from threat intelligence"

    - name: high_threat_score
      condition: "ip_enrichment.any(threat_score > 80)"
      weight: 35
      description: "IP has threat score above 80"

    - name: moderate_threat_score
      condition: "ip_enrichment.any(threat_score > 50)"
      weight: 20
      description: "IP has threat score above 50"

    - name: many_failed_attempts
      condition: "suspicious_ips.any(FailedAttempts > 100)"
      weight: 25
      description: "IP with over 100 failed sign-in attempts"

    - name: multiple_suspicious_ips
      condition: "suspicious_ips.length > 5"
      weight: 15
      description: "More than 5 suspicious IPs detected"

    # Low-risk indicators (negative weights)
    - name: few_ips
      condition: "suspicious_ips.length < 3"
      weight: -10
      description: "Only 1-2 suspicious IPs (may be normal)"

    - name: low_threat_scores
      condition: "ip_enrichment.all(threat_score < 30)"
      weight: -15
      description: "All IPs have low threat scores"

  thresholds:
    - level: "CRITICAL"
      min_score: 50
      summary: "Risk score {{ score }} indicates critical threat"
      recommendation: "Immediate action required. Block IPs and investigate."

    - level: "HIGH"
      min_score: 30
      summary: "Risk score {{ score }} indicates elevated risk"
      recommendation: "Review and consider blocking suspicious IPs."

    - level: "MEDIUM"
      min_score: 10
      summary: "Risk score {{ score }} indicates moderate risk"
      recommendation: "Monitor activity and review sign-in patterns."

    - level: "LOW"
      min_score: -100
      summary: "Risk score {{ score }} indicates low risk"
      recommendation: "Continue normal monitoring."
