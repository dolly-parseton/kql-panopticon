# ===========================================================================
# SCORING ENGINE
# ===========================================================================
scoring:
  indicators:
    # HIGH-RISK indicators (positive weights)
    - name: user_clicked_malicious
      condition: "click_activity.any(HighRisk_UserClickedThrough == true)"
      weight: 50
      description: "User clicked through to potentially malicious URL"

    - name: threat_attachment
      condition: "attachment_analysis.any(HighRisk_ThreatAttachment == true)"
      weight: 40
      description: "Attachment has active threat detection"

    - name: high_risk_extension
      condition: "attachment_analysis.any(HighRisk_HighRiskExtension == true)"
      weight: 25
      description: "Attachment has high-risk file extension"

    - name: high_quarantine_rate
      condition: "sender_reputation.any(HighRisk_HighQuarantineRate == true)"
      weight: 30
      description: "Sender domain has >30% quarantine rate"

    - name: failed_authentication
      condition: "email_details.any(AuthPassed == false)"
      weight: 15
      description: "Email failed SPF/DKIM/DMARC authentication"

    - name: new_sender
      condition: "sender_address_history.length == 0"
      weight: 10
      description: "Sender has no prior email history"

    - name: null_sender
      condition: "root_domains.length == 0"
      weight: 25
      description: "Email has null/empty sender (P1Sender) - common phishing evasion technique"

    # LOW-RISK indicators (negative weights)
    - name: marketing_sender
      condition: "sender_reputation.any(FailEarly_LikelyMarketing == true)"
      weight: -30
      description: "Sender matches marketing/newsletter pattern"

    - name: legitimate_sender
      condition: "sender_reputation.any(FailEarly_LikelyLegitimate == true)"
      weight: -25
      description: "Sender has established legitimate history"

    - name: all_microsoft_urls
      condition: "url_analysis.any(FailEarly_AllMicrosoftUrls == true)"
      weight: -20
      description: "All URLs point to Microsoft domains"

    - name: all_known_safe_urls
      condition: "url_analysis.any(FailEarly_AllKnownSafe == true)"
      weight: -15
      description: "All URLs are Microsoft or known-safe services"

    - name: no_attachments
      condition: "attachment_analysis.length == 0 or attachment_analysis.any(FailEarly_NoAttachments == true)"
      weight: -10
      description: "Email has no attachments"

    - name: only_image_attachments
      condition: "attachment_analysis.any(FailEarly_OnlyImages == true)"
      weight: -10
      description: "Attachments are only images (marketing pattern)"

    - name: no_click_activity
      condition: "click_activity.length == 0"
      weight: -5
      description: "No users clicked any URLs"

    - name: high_inbox_rate
      condition: "sender_reputation.any(InboxRate > 90)"
      weight: -15
      description: "Sender has >90% inbox delivery rate"

    - name: established_sender
      condition: "sender_address_history.any(DaysSinceFirstSeen > 14)"
      weight: -20
      description: "Sender has been active for >14 days"

  thresholds:
    - level: "CRITICAL - TRUE POSITIVE"
      min_score: 50
      summary: "Risk score {{score}} indicates high-confidence threat"
      recommendation: "Approve ZAP action immediately. Initiate incident response."

    - level: "HIGH - SUSPICIOUS"
      min_score: 25
      summary: "Risk score {{score}} indicates elevated risk"
      recommendation: "Approve ZAP action. Monitor for related activity."

    - level: "MEDIUM - REQUIRES REVIEW"
      min_score: 0
      summary: "Risk score {{score}} - manual review recommended"
      recommendation: "Review all indicators before deciding."

    - level: "LOW - LIKELY BENIGN"
      min_score: -25
      summary: "Risk score {{score}} suggests low threat probability"
      recommendation: "Consider rejecting ZAP action. May be false positive."

    - level: "MINIMAL - FALSE POSITIVE"
      min_score: -100
      summary: "Risk score {{score}} strongly suggests false positive"
      recommendation: "Reject ZAP action. Add sender to safe list if needed."
