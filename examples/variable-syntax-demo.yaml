# Variable Substitution Syntax Demo Pack
#
# Demonstrates the pipe-based variable substitution system.
# Uses datatable() queries to simulate real data.

name: Variable Syntax Demo
description: Demonstrates variable substitution syntax for transforms and conditions
version: "1.0"

acquisition:
  inputs:
    # String input - used directly
    - name: target_user
      type: string
      label: Target User
      description: Primary user to investigate
      required: true
      example: "alice@contoso.com"

    # Array input - comma-separated, requires | array transform
    - name: target_ips
      type: array
      label: Target IP Addresses
      description: Comma-separated list of IP addresses
      required: false
      default: "10.0.0.1, 192.168.1.100"

  steps:
    # Step 1: Base data using datatable
    - name: users
      type: kql
      query: |
        datatable(name:string, email:string, department:string, score:int) [
          "Alice", "alice@contoso.com", "Engineering", 95,
          "Bob", "bob@contoso.com", "Sales", 78,
          "Charlie", "charlie@contoso.com", "Engineering", 82,
          "Diana", "diana@contoso.com", "HR", 88
        ]
      timespan: P1D

    # Step 2: Filter using input value
    - name: filtered_user
      type: kql
      depends_on: [users]
      query: |
        // Using input substitution
        let target = '{{inputs.target_user}}';
        datatable(name:string, email:string, department:string, score:int) [
          "Alice", "alice@contoso.com", "Engineering", 95,
          "Bob", "bob@contoso.com", "Sales", 78
        ]
        | where email == target
      timespan: P1D

    # Step 3: Use first value from previous step
    - name: use_first_value
      type: kql
      depends_on: [users]
      when: "{{users | is_not_empty}}"
      query: |
        // Using | first transform to get first row's value
        let first_user = '{{users.email | first}}';
        print first_user
      timespan: P1D

    # Step 4: Use array of values in dynamic array
    - name: use_array_values
      type: kql
      depends_on: [users]
      query: |
        // Using | array transform to build a KQL array
        let all_emails = dynamic([{{users.email | array}}]);
        print count=array_length(all_emails), emails=all_emails
      timespan: P1D

    # Step 5: Use unique values
    - name: unique_departments
      type: kql
      depends_on: [users]
      query: |
        // Using | unique transform for distinct values
        let departments = dynamic([{{users.department | array | unique}}]);
        print departments
      timespan: P1D

    # Step 6: Conditional execution with predicate
    - name: high_scorers
      type: kql
      depends_on: [users]
      when: "{{users | any(score > 80)}}"
      query: |
        datatable(name:string, score:int) [
          "Alice", 95,
          "Charlie", 82,
          "Diana", 88
        ]
        | where score > 80
      timespan: P1D

    # Step 7: Array input usage
    - name: ip_lookup
      type: kql
      query: |
        // Using array input with | array transform
        let target_ips = dynamic([{{inputs.target_ips | array}}]);
        datatable(ip:string, status:string) [
          "10.0.0.1", "clean",
          "192.168.1.100", "suspicious",
          "203.0.113.50", "malicious"
        ]
        | where ip in (target_ips)
      timespan: P1D

    # Step 8: String join for comma-separated list
    - name: joined_names
      type: kql
      depends_on: [users]
      query: |
        // Using | str_join transform
        let names = '{{users.name | array | str_join(", ")}}';
        print names
      timespan: P1D

    # Step 9: Length comparison condition
    - name: length_check
      type: kql
      depends_on: [users]
      when: "{{users | length | gt(2)}}"
      query: |
        print user_count_exceeds_2 = true
      timespan: P1D

    # Step 10: All predicate
    - name: all_pass_check
      type: kql
      depends_on: [users]
      when: "{{users | all(score > 50)}}"
      query: |
        print all_scores_above_50 = true
      timespan: P1D

processing:
  steps:
    - name: analysis_score
      type: scoring
      indicators:
        - name: has_high_scorers
          condition: "{{users | any(score > 90)}}"
          weight: 20
          description: At least one user has a score above 90

        - name: all_positive_scores
          condition: "{{users | all(score > 0)}}"
          weight: 10
          description: All users have positive scores

        - name: has_users
          condition: "{{users | is_not_empty}}"
          weight: 5
          description: User data was retrieved

        - name: multiple_departments
          condition: "{{users | length | gt(2)}}"
          weight: 15
          description: More than 2 users in dataset

      thresholds:
        - level: HIGH
          min_score: 30
          summary: "High analysis score ({{score}})"
          recommendation: Detailed review recommended

        - level: MEDIUM
          min_score: 15
          summary: "Medium analysis score ({{score}})"

        - level: LOW
          min_score: 0
          summary: "Low analysis score ({{score}})"

reporting:
  reports:
    - name: summary
      format: markdown
      template: |
        # Variable Syntax Demo Results

        This report demonstrates the variable substitution syntax.

        ## Input Values
        - Target User: {{inputs.target_user}}

        ## Analysis Score
        Check processing results for scoring output.
